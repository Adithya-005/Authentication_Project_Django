<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify password change</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h1 class="mb-4">Verify password change</h1>
                <p class="text-secondary">Enter the 6-digit code sent to your email address. It expires in 5 minutes.</p>
                <form method="post" class="card card-body shadow-sm">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Verify code</button>
                </form>
                <p class="mt-3"><a href="{% url 'update_password' %}">Request a new code</a></p>
            </div>
        </div>
    </main>
</body>
</html>
