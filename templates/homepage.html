<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <section class="card card-body shadow-sm">
                    <h1 class="mb-3">Welcome, {{ user.username }}</h1>
                    <p class="text-secondary">Manage your account settings.</p>
                    <div class="d-flex flex-wrap gap-2">
                        <a class="btn btn-primary" href="{% url 'update_password' %}">Update password</a>
                        <a class="btn btn-outline-secondary" href="{% url 'signout' %}">Sign out</a>
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
